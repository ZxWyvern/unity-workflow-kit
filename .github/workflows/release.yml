name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-tests
        run: python tests/run_tests.py
      - name: Build bundle
        run: python tools/bundle.py
      - name: Package
        run: |
          mkdir -p out
          git archive --format=zip --prefix=unity-workflow-agent-generator/ \
            -o "out/unity-workflow-agent-generator-${{ github.ref_name }}.zip" HEAD
          cp dist/Unity_Workflow_Agent_Generator_bundle.md out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
